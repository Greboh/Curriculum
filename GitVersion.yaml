workflow: GitHubFlow/v1
mode: ContinuousDeployment

branches:
  main:
    label: ""
    increment: Patch
    is-main-branch: true

  pull-request:
    mode: ContinuousDeployment
    label: rc
    increment: Inherit
    prevent-increment:
      of-merged-branch: true

  feature:
    label: alpha
    increment: Inherit