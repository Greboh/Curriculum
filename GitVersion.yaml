mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    label: ""
    increment: Patch
    is-main-branch: true
    
  pull-request:
    mode: ContinuousDeployment
    label: rc
    increment: Inherit
    prevent-increment:
      of-merged-branch: true
      
  feature:
    regex: ^features?[/-]
    mode: ContinuousDeployment
    label: alpha
    increment: Inherit
    
ignore:
  sha: []