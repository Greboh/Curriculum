apiVersion: batch/v1
kind: Job
metadata:
  name: curriculum-migrator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: curriculum-migrator
    spec:
      restartPolicy: Never
      containers:
        - name: migrator
          image: ghcr.io/greboh/curriculum-migrator:latest
          imagePullPolicy: Always
          env:
            - name: DatabaseName
              value: curriculum
            - name: ConnectionStrings__Npgsql
              valueFrom:
                secretKeyRef:
                  name: curriculum-db
                  key: ConnectionStrings__Npgsql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi