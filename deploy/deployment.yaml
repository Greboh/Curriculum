apiVersion: apps/v1
kind: Deployment
metadata:
  name: curriculum-api
  labels:
    app: curriculum-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curriculum-api
  template:
    metadata:
      labels:
        app: curriculum-api
    spec:
      containers:
        - name: api
          image: ghcr.io/greboh/curriculum:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Npgsql
              valueFrom:
                secretKeyRef:
                  name: curriculum-db
                  key: ConnectionStrings__Npgsql
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /alive
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi