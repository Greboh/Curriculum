name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: read
  checks: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.8.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          useConfigFile: true
          configFilePath: GitVersion.yaml

      - name: Summary
        run: |
          {
            echo "### GitVersion"
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| FullSemVer | \`${{ steps.gitversion.outputs.fullSemVer }}\` |"
            echo "| SemVer | \`${{ steps.gitversion.outputs.semVer }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Curriculum.slnx -c Release --verbosity normal

  publish:
    needs: [version, test]
    runs-on: ubuntu-latest
    if: >
      needs.version.result == 'success'
      && needs.test.result == 'success'
      && (
        github.event_name == 'pull_request'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=edge,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
      needs: [version, publish]
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - name: Create and push tag
          run: |
            TAG="v${{ needs.version.outputs.majorMinorPatch }}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping create"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
        - name: GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ needs.version.outputs.majorMinorPatch }}
            name: v${{ needs.version.outputs.majorMinorPatch }}
            generate_release_notes: true
